name: hoteliq
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  go_router: ^18.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  injectable: ^3.0.0
  hydrated_bloc: ^11.0.0
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  path_provider: ^2.1.6
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_24pt-Regular.ttf
